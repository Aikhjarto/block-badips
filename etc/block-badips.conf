BADIPS_NO_STDERR=1
# Where to fetch the list of IPs to block from. Defaults to the list of all
# IPs reported to blocklist.de.
#URL="https://lists.blocklist.de/lists/all.txt"
# Credentials, if the list requires authentication.
#BADIPS_USER="username"
#BADIPS_PASSWORD="password"
# Ranges with a shorter prefix in the downloaded list are ignored.
#BADIPS_MIN_PREFIX4=8
#BADIPS_MIN_PREFIX6=32
# A list that is shorter than the last valid one by more than this percentage
# is refused; 100 disables the check.
#BADIPS_MAX_SHRINK_PERCENT=50
# Maximum number of entries of each ipset. By default twice the number of
# entries of the list, but at least 65536.
#BADIPS_IPSET_MAXELEM=
