name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck usr/sbin/block-badips.sh usr/lib/nagios/plugins/check_block-badips.sh tests/run-tests.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ipset iptables
      # run as root, since Ubuntu restricts unprivileged user namespaces
      - name: Run tests
        run: sudo tests/run-tests.sh
